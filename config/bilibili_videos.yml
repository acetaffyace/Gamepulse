# B 站视频注册表 —— 三款游戏对照
#
# 核验方式：
#   全部条目的 owner.mid 经官方 view / related 接口核验，必须属于该游戏
#   official_accounts 中明确登记的官方账号。发现渠道为公开 archive/related 接口
#   + mid 过滤，不调用有风控的搜索接口。
#
#   核验已剔除多个伪装度很高的非官方投稿，例如：
#     BV1wULQ64EB9「先导演示丨蕾米埃尔」实为「哔哩哔哩游戏中心」(mid 1328260)
#     BV1rAB8BjEpR / BV1iGB8BgEZ8 / BV1ejB8BqEzZ 实为「异环攻略组」搬运
#
# video_pairs.yml 是本轮核心视频的收录、版本归属和跨平台配对依据。
# 角色宣传视频可以早于版本正式更新时间发布；按发布时间机械归类会错。
# 本文件保留官方 B 站视频身份与标题，video_pairs.yml 负责人工确认的版本映射。
#
# 原三款游戏的收录范围：2026-06-17 至 2026-10-08。当前统计使用四类核心视频，
#   具体清单与 YouTube 四语区配对见 config/video_pairs.yml。
#
# 首次核验日期: 2026-09-17；增量核验日期见各条目的 verified_at。
# B 站计数按 BV 原生合集获取，含多语言分 P 的 BV 不拆成多条、不声称能取各 P 独立播放。

