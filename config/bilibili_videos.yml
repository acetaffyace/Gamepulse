# B 站视频注册表 —— 三款游戏对照
#
# 核验方式：
#   全部条目的 owner.mid 经官方 view / related 接口核验，必须等于该游戏
#   official_accounts 中登记的 mid。发现渠道为公开的 archive/related 接口
#   + mid 过滤，不调用有风控的搜索接口。
#
#   核验已剔除多个伪装度很高的非官方投稿，例如：
#     BV1wULQ64EB9「先导演示丨蕾米埃尔」实为「哔哩哔哩游戏中心」(mid 1328260)
#     BV1rAB8BjEpR / BV1iGB8BgEZ8 / BV1ejB8BqEzZ 实为「异环攻略组」搬运
#
# version_id / version_confirmed：
#   只有标题自带版本号时才填写版本并标 confirmed: true（如「3.6版本PV」）。
#   角色视频不臆测版本归属 —— 角色 PV 通常早于版本更新日 5-12 天发布，
#   按日期机械归类会错。看板中角色视频的版本归属由其在版本竖线之间的
#   位置体现，而不是由本文件断言。
#
# 收录范围：2026-06 起。三款游戏的共同可比窗口始于绝区零 Steam 上线
#   (2026-06-17)，更早的视频播放量已接近饱和，日增量无分析价值。
#
# 核验日期: 2026-09-14

