# 看板轨道目录（L2 自定义的核心）
#
# 加一个指标 = 在这里加一条，不改任何图表代码。
# build_dashboard_config.py 会把本文件编译成 data/dashboard_config.json，
# 并**逐条验证 source/path/field 能在真实快照里取到值** ——
# 写错字段名会在构建时报错，而不是在页面上默默渲染成一条空轨道。
#
# 颜色说明：
#   颜色只在**轨道内部**区分系列。不同轨道可以复用同一个色位，
#   因为轨道在垂直方向上是分开的、各有标题和独立纵轴，
#   识别靠的是位置和标题，不是颜色。这样就不必为了凑轨道数量
#   去发明一堆未经对比度校验的新颜色。
#   slot1/2/3/5/7 来自已通过 validate_palette(light) 的调色板：
#   色阶带 / 彩度下限 / 色盲分离度 / 常视力对比度四项全部 PASS。

palette:
  slot1: '#2a78d6'   # blue
  slot2: '#eb6834'   # orange
  slot3: '#1baf7a'   # aqua
  slot5: '#e87ba4'   # magenta
  slot7: '#4a3aa7'   # violet
  neutral: '#898781' # 仅用于参考线与不承载数值的辅助元素

# 堆叠构成图（语种占比）专用的顺序色阶。
# 这类图不能用上面那 5 个分类色位轮换：语种有 9 个，色位只有 5 个，
# 靠透明度区分中间几层在实际渲染里几乎看不出来。
# 语种本身是按占比排序的，属于有序类别，顺序色阶才是对的形式 ——
# 由深到浅正好对应由大到小，读者不查图例也能看懂谁是大头。
share_ramp:
  - '#16365f'
  - '#1d4c86'
  - '#2a78d6'
  - '#4d97e2'
  - '#7ab5ea'
  - '#a3cdf2'
  - '#c6e0f8'
  - '#e0edfb'
share_other: '#c3c2b7'   # 「其他」用中性灰，明确不属于色阶序列

# adapter 决定「怎么从快照里取数」，是配置与代码之间唯一的契约。
#   series        取 path 指向的数组，按 date_local 对齐，读 field
#   video_scatter 取视频数组，x = 发布日，y = 最新的 field 值
#   video_delta   取视频数组，按日期汇总全部视频的 field 日增量
#   stacked_share 取语种分桶，堆叠面积
#
# 新增 adapter 需要动 dashboard/app.js 的 ADAPTERS 表；
# 而在已有 adapter 上加指标只需要改本文件。

# 视频轨道的第一版分析范围：只看能代表版本传播节奏的主要官方内容。
# 其它官方投稿仍保留在注册表和采集数据中，但不进入默认视频轨道。
important_video_types: &important_video_types
  - version_trailer
  - character_trailer
  - character_demo
  - character_ep

lanes:
  - id: new_reviews
    title: 每日新增评测
    subtitle: 回填重建 · 讨论热度代理
    adapter: series
    path: review_history
    field: new_reviews
    chart: bar
    color: slot1
    height: 140
    unit: count
    enabled: true
    caveat: 仅含今天仍存在的评测，越早的日期越可能低估

  - id: review_rate
    title: 好评率
    subtitle: 当日 / 全局累计 / 版本滚动累计（版本对象专属）
    adapter: series
    path: review_history
    chart: line
    height: 110
    unit: percent
    enabled: true
    # 多对象对照时每个对象只画一条线，画哪条由 compare_field 指定。
    # 这里取累计而不是当日：当日好评率本身锯齿很重，三四条叠在一起
    # 只剩噪声；累计线平滑，能看出口碑的走向差异。
    compare_field: cumulative_review_rate
    # 同一条轨道可以放多个系列，前提是单位相同、可以共用一个纵轴
    series:
      - field: daily_review_rate
        name: 当日好评率
        color: slot2
        width: 1.5
        opacity: 0.75
      - field: cumulative_review_rate
        name: 累计好评率
        color: slot3
        width: 2.5
        smooth: true
        end_label: true

  - id: online
    title: Steam 同时在线人数
    subtitle: 逐日观测 / SteamDB 历史回填 · 平台同时在线，非 DAU
    adapter: series
    path: online_series
    field: value
    chart: line
    color: slot7
    height: 110
    unit: count
    enabled: true
    symbol: true
    caveat: 当前值来自 Steam 官方接口；历史段来自 SteamDB 图表日点位，二者都是平台同时在线观测，不是 DAU

  - id: online_band
    title: 在线日峰谷
    subtitle: 小时级采样 · 峰值与谷值
    adapter: series
    path: online_daily
    chart: line
    height: 110
    unit: count
    enabled: false
    series:
      - field: peak
        name: 日峰值
        color: slot7
        width: 2
      - field: trough
        name: 日谷值
        color: slot7
        width: 1
        opacity: 0.45
        dashed: true
    caveat: 采样点少于 6 个的日期标 partial，半天的样本算不出真实日峰值

  - id: version_marks
    title: 版本节奏
    subtitle: 每个对比对象一行 · 取自各自 Steam 官方公告
    adapter: version_marks
    path: events
    chart: marks
    height: 74
    enabled: false
    caveat: 多对象对照时版本线画在本轨道内，不贯穿全图 —— 各自的版本不是同一个事件

  - id: playtime_median
    title: 评测者中位游戏时长
    subtitle: 写评测时已玩多久 · 小时
    adapter: series
    path: review_profile.daily
    field: playtime_at_review_median
    chart: line
    color: slot2
    height: 110
    unit: minutes_as_hours
    enabled: true
    caveat: 评测者不是玩家的随机样本，只代表写评测的人

  - id: short_play_share
    title: 2 小时内评测占比
    subtitle: Steam 退款时长线以内就来评测的比例
    adapter: series
    path: review_profile.daily
    field: short_play_share
    chart: line
    color: slot1
    height: 100
    unit: percent
    enabled: false

  - id: heavy_play_share
    title: 100 小时以上评测占比
    subtitle: 重度玩家在评测者中的比例
    adapter: series
    path: review_profile.daily
    field: heavy_play_share
    chart: line
    color: slot3
    height: 100
    unit: percent
    enabled: false

  - id: language_delta
    title: 评测语种结构变化
    subtitle: 相对首个周的百分点差 · 0 为基线
    adapter: share_delta
    path: review_profile.language_share
    chart: line
    height: 130
    unit: pp
    top_n: 5
    enabled: false
    single_only: true
    caveat: 只画变化幅度最大的几个语种，尾部语种的占比本来就在噪声量级

  - id: language_share
    title: 评测语种构成
    subtitle: 7 天分桶（版本对象从更新日计周） · 绝对占比
    adapter: stacked_share
    path: review_profile.language_share
    chart: stacked_area
    height: 130
    unit: percent
    enabled: false
    single_only: true
    caveat: 100% 堆叠的中间层没有稳定基线，看结构变化请用「语种结构变化」轨道

  - id: bili_videos
    title: B 站重点官方视频
    subtitle: 横轴为发布日 · 纵轴为当前累计播放量
    adapter: video_scatter
    path: bilibili.videos
    field: view
    content_types: *important_video_types
    chart: scatter
    color: slot5
    height: 130
    unit: count
    enabled: true
    caveat: 仅登记视频集合，不是全站播放量，也不是独立观众数

  - id: bili_version_pv
    title: B 站版本 PV
    subtitle: 只含版本 PV · 发布日 × 当前累计播放
    adapter: video_scatter
    path: bilibili.videos
    field: view
    content_types: [version_trailer]
    chart: scatter
    color: slot7
    height: 110
    unit: count
    enabled: false
    caveat: 版本 PV 与角色 PV 的发布节奏和推荐位待遇不同，混在一起比没有意义

  - id: bili_character_pv
    title: B 站角色 PV / 演示
    subtitle: 只含角色 PV 与战斗演示 · 发布日 × 当前累计播放
    adapter: video_scatter
    path: bilibili.videos
    field: view
    content_types: [character_trailer, character_demo, character_ep]
    chart: scatter
    color: slot5
    height: 110
    unit: count
    enabled: false
    caveat: 角色 PV 通常早于版本更新日 5-12 天发布，位置不等于版本归属

  - id: bili_ramp
    title: B 站重点内容发布后播放曲线
    subtitle: 一支视频一条线 · 横轴为发布后第 N 天
    adapter: video_ramp
    path: bilibili.videos
    field: view
    content_types: *important_video_types
    chart: line
    color: slot5
    height: 150
    unit: count
    enabled: false
    caveat: 接口只返回当前累计值，曲线只能从开始采集那天往后长；虚线表示缺起跑段

  - id: bili_version_ramp
    title: B 站版本 PV 播放曲线
    subtitle: 只含版本 PV · 横轴为发布后第 N 天
    adapter: video_ramp
    path: bilibili.videos
    field: view
    content_types: [version_trailer]
    chart: line
    color: slot7
    height: 130
    unit: count
    enabled: false
    caveat: 同类内容按发布后天数对齐，这是唯一跨视频公平的播放量比较方式

  - id: bili_view_delta
    title: B 站重点内容日增播放
    subtitle: 全部登记视频的播放量日增量合计
    adapter: video_delta
    path: bilibili.videos
    field: view
    content_types: *important_video_types
    chart: bar
    color: slot5
    height: 110
    enabled: false

  - id: bili_engagement
    title: B 站重点内容互动率
    subtitle: （点赞+投币+收藏）/ 播放 · 按视频发布日定位
    adapter: video_scatter
    path: bilibili.videos
    field: engagement
    content_types: *important_video_types
    from_rates: true
    chart: scatter
    color: slot3
    height: 110
    unit: percent
    enabled: false
    caveat: 互动率跨视频可比，播放量不可比 —— 后者受推荐位影响极大

  # ── YouTube：按语区分开的轨道 ──────────────────────────────────────
  #
  # 每款游戏有 global/ja/ko/zh-tw 四个官方频道，同一支 PV 在四处各发一遍，
  # 是四个不同的 video_id。这里**刻意不设「YouTube 合计」轨道** ——
  # 快照里也没有可供它取数的跨语区合计（见 build_snapshot.py）。
  # 四条轨道并排堆叠，比较靠横向读，不靠求和。
  #
  # 播放量轨道跨语区**不可直接比大小**：频道体量差一个数量级
  # （global 186 万订阅 vs NTE 韩语 3.3 万），播放量差主要来自盘子大小，
  # 不是内容表现。跨语区看差异请用下面的互动率轨道 —— 它以播放为分母，
  # 是截面比值，不受频道体量影响。

  - id: yt_view_global
    title: YouTube 重点内容播放 · 全球
    subtitle: 横轴为发布日 · 纵轴为当前累计观看数
    adapter: video_scatter
    path: youtube.locales.global.videos
    field: view
    content_types: *important_video_types
    chart: scatter
    color: slot1
    height: 110
    unit: count
    enabled: false
    caveat: 累计值随时间自然增长，跨视频比大小不公平；跨语区更不可比

  - id: yt_view_ja
    title: YouTube 重点内容播放 · 日语
    subtitle: 横轴为发布日 · 纵轴为当前累计观看数
    adapter: video_scatter
    path: youtube.locales.ja.videos
    field: view
    content_types: *important_video_types
    chart: scatter
    color: slot2
    height: 110
    unit: count
    enabled: false
    caveat: 累计值随时间自然增长，跨视频比大小不公平；跨语区更不可比

  - id: yt_view_ko
    title: YouTube 重点内容播放 · 韩语
    subtitle: 横轴为发布日 · 纵轴为当前累计观看数
    adapter: video_scatter
    path: youtube.locales.ko.videos
    field: view
    content_types: *important_video_types
    chart: scatter
    color: slot3
    height: 110
    unit: count
    enabled: false
    caveat: 累计值随时间自然增长，跨视频比大小不公平；跨语区更不可比

  - id: yt_view_zhtw
    title: YouTube 重点内容播放 · 繁中
    subtitle: 横轴为发布日 · 纵轴为当前累计观看数
    adapter: video_scatter
    path: youtube.locales.zh-tw.videos
    field: view
    content_types: *important_video_types
    chart: scatter
    color: slot5
    height: 110
    unit: count
    enabled: false
    caveat: 累计值随时间自然增长，跨视频比大小不公平；跨语区更不可比

  # 互动率是四个语区之间唯一能横向对比的指标：以播放为分母的截面比值，
  # 不受频道订阅体量与发布时间影响。「日语频道互动率高于全球频道」
  # 是一个有意义的陈述；「日语频道播放低于全球频道」不是。
  - id: yt_engagement_global
    title: YouTube 重点内容互动率 · 全球
    subtitle: （点赞+评论）/ 播放
    adapter: video_scatter
    path: youtube.locales.global.videos
    field: engagement
    content_types: *important_video_types
    from_rates: true
    chart: scatter
    color: slot1
    height: 100
    unit: percent
    enabled: false
    caveat: 点赞与评论可被创作者隐藏，隐藏时记 null 不记 0

  - id: yt_engagement_ja
    title: YouTube 重点内容互动率 · 日语
    subtitle: （点赞+评论）/ 播放
    adapter: video_scatter
    path: youtube.locales.ja.videos
    field: engagement
    content_types: *important_video_types
    from_rates: true
    chart: scatter
    color: slot2
    height: 100
    unit: percent
    enabled: false
    caveat: 点赞与评论可被创作者隐藏，隐藏时记 null 不记 0

  - id: yt_engagement_ko
    title: YouTube 重点内容互动率 · 韩语
    subtitle: （点赞+评论）/ 播放
    adapter: video_scatter
    path: youtube.locales.ko.videos
    field: engagement
    content_types: *important_video_types
    from_rates: true
    chart: scatter
    color: slot3
    height: 100
    unit: percent
    enabled: false
    caveat: 点赞与评论可被创作者隐藏，隐藏时记 null 不记 0

  - id: yt_engagement_zhtw
    title: YouTube 重点内容互动率 · 繁中
    subtitle: （点赞+评论）/ 播放
    adapter: video_scatter
    path: youtube.locales.zh-tw.videos
    field: engagement
    content_types: *important_video_types
    from_rates: true
    chart: scatter
    color: slot5
    height: 100
    unit: percent
    enabled: false
    caveat: 点赞与评论可被创作者隐藏，隐藏时记 null 不记 0

  # ---- 四个语区放进同一张图 ----
  #
  # 上面那组「一个语区一条轨道」的做法，理由是播放量跨语区不可直接比大小。
  # 那条理由针对的是**线性共享纵轴**：实测各语区播放中位数
  # global 118k / ja 58k / ko 39k / zh-tw 17k，最大值 607 万，跨近三个数量级，
  # 硬叠在一条线性轴上繁中区会被压成贴底的直线。
  #
  # 换成下面这套编码之后，同图对照是成立的：
  #   纵轴取对数 —— 读的是垂直距离＝倍数，语区之间那段恒定落差就是体量差本身；
  #   纵轴可切到「相对本语区中位数」—— 体量被除掉，跨语区比较这才真正合法；
  #   语区身份由**形状**承载，颜色只是辅助（多对象时颜色归对比对象）。
  #
  # 于是「日语区那支 PV 跑到了本区常态的 8 倍」这种话可以说了，
  # 而「日语区播放低于全球区」依然不是一个有意义的陈述。
  - id: yt_view_locales
    title: YouTube 重点内容语区播放对照
    subtitle: 横轴为发布日 · 一个语区一种形状
    adapter: locale_scatter
    path: youtube.locales
    order_path: youtube.locale_order
    locales: [global, ja, ko, zh-tw]
    field: view
    content_types: *important_video_types
    chart: scatter
    height: 150
    unit: count
    # 播放量跨三个数量级（1.7 万 ~ 607 万），必须对数轴
    log: true
    enabled: true
    scales:
      - id: abs
        label: 播放量
        hint: 对数纵轴。语区之间的垂直落差＝频道体量差，不是内容表现差。
      - id: index
        label: 相对本语区
        hint: 每个点除以本语区播放量中位数，体量被除掉，跨语区可比。
    caveat: 累计播放随时间自然增长，发布越久越高；跨语区比大小请切到「相对本语区」

  - id: yt_engagement_locales
    title: YouTube 重点内容语区互动率对照
    subtitle: （点赞+评论）/ 播放 · 一个语区一种形状
    adapter: locale_scatter
    path: youtube.locales
    order_path: youtube.locale_order
    locales: [global, ja, ko, zh-tw]
    field: engagement
    content_types: *important_video_types
    from_rates: true
    chart: scatter
    height: 140
    unit: percent
    enabled: true
    scales:
      - id: abs
        label: 互动率
        hint: 互动率本身就是截面比值，不受体量影响，四个语区可以直接比大小。
      - id: index
        label: 相对本语区
        hint: 除以本语区互动率中位数，看的是「这支比同区常态高多少」。
    caveat: 点赞与评论可被创作者隐藏，隐藏时记 null 不记 0

  # 发布后播放曲线：按各自发布日对齐，这是跨语区比「起量速度」的正确形式。
  # 只能从开始采集那天往后长，事后补登记的视频缺起跑段、画虚线。
  - id: yt_ramp_global
    title: YouTube 重点内容发布后播放曲线 · 全球
    subtitle: 横轴为发布后第 N 天
    adapter: video_ramp
    path: youtube.locales.global.videos
    field: view
    content_types: *important_video_types
    chart: line
    color: slot1
    height: 120
    unit: count
    enabled: false
    caveat: 补登记的视频缺起跑段，曲线画虚线并标出缺口

  - id: yt_ramp_ja
    title: YouTube 重点内容发布后播放曲线 · 日语
    subtitle: 横轴为发布后第 N 天
    adapter: video_ramp
    path: youtube.locales.ja.videos
    field: view
    content_types: *important_video_types
    chart: line
    color: slot2
    height: 120
    unit: count
    enabled: false
    caveat: 补登记的视频缺起跑段，曲线画虚线并标出缺口

# 预设视图：一键切换关注点。用户改动会覆盖预设并存进 localStorage。
presets:
  default:
    label: 默认
    lanes: [new_reviews, review_rate, online, playtime_median, bili_videos, yt_view_locales, yt_engagement_locales]
  compare:
    label: 多对象对照
    lanes: [new_reviews, review_rate, version_marks, bili_engagement]
  versions:
    label: 版本对照
    lanes: [new_reviews, review_rate, playtime_median, bili_version_ramp]
  player_profile:
    label: 玩家结构
    lanes: [new_reviews, playtime_median, short_play_share, heavy_play_share, language_delta]
  propagation:
    label: 传播端
    lanes: [bili_version_pv, bili_character_pv, bili_engagement, bili_ramp, yt_view_locales, yt_engagement_locales]
  online_focus:
    label: 在线盘
    lanes: [online, online_band, new_reviews, review_rate]
