# 版本表：版本对比窗口的唯一依据。
#
# 每个已开放版本一行，写明开放时间与来源。构建快照时，Steam 官方公告中
# 识别出的版本更新会与本表核对：公告里出现而本表没有的版本、同一大版本内
# 跳号（如 3.2 → 3.4）都会写进数据质量提示，而不是悄悄把两个版本并成一个窗口。
#
# 字段
#   steam_start_at / steam_start_date  Steam 端开放时间（UTC+8）。有精确时刻用 _at。
#   cn_start_at / cn_start_date        国服开放时间，与 Steam 不同日时填写。
#   source                             steam_announcement = Steam 官方社区公告发布日；
#                                      official_site = 游戏官网 / 官方渠道的更新公告。
#   source_url                         可点开核对的来源链接。
#   status                             released = 已开放；scheduled = 已公布但尚未在 Steam 开放，
#                                      不会成为版本分界线。
#   note                               核对过程中需要说明的事项。

