# Curated official video pairs for the shared comparison window.
# The original three games retain the four user-selected formats; localized YouTube uploads
# stay separate and map to the corresponding Bilibili post where available.
scope:
  start_date: '2026-06-17'
  end_date: '2026-10-08'
  content_types: [version_trailer, character_trailer, character_demo, character_ep]
  excluded_titles: ['群星交错', '决战时刻｜翼刃出鞘']
  by_game:
    naraka_bladepoint:
      start_date: '2026-07-08'
      end_date: '2026-10-08'
      content_types: [version_trailer, character_trailer, character_demo, character_ep,
                      season_teaser, collaboration_trailer, cosmetic_showcase, event_promo,
                      esports, tutorial, shorts, theme_song, other]

