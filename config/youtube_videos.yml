# YouTube 官方频道与视频注册表
#
# 自动发现表保留频道上传目录；当前用于采集和看板的核心视频白名单、
# 人工分类、版本归属及 B 站对应关系以 config/video_pairs.yml 为准。
#
# 与 B 站注册表对称，但有一个关键差别：
#   B 站的搜索接口有风控（实测 HTTP 412），官方视频只能靠 related 接口
#   半自动发现 + 人工登记；
#   YouTube Data API 可以直接列出频道的 uploads 播放列表，**新视频能自动发现**，
#   因此 videos 段由 youtube_discover.py 追加，不需要手工抄 ID。
#
# ── 语区维度（locale）────────────────────────────────────────────────
#
# 一款游戏有多个官方频道，按语区分开运营。结构是 game_id → locale → 频道。
#
#   locale 取值：global（英语/全球）、ja（日语）、ko（韩语）、zh-tw（繁体中文）
#
# **locale 不是 games.yml 里的 region。** games.yml 的 region: CN 指的是
# 厂商所在地（库洛/米哈游/完美世界都在国内），描述的是「谁做的」；
# 这里的 locale 描述的是「发给谁看的」。两者取值域完全不同，不要混用。
#
# 为什么必须分开、不能合并统计：
#   同一支 PV 会在 4 个语区频道各发一遍，是 4 个不同的 video_id。
#   把它们的播放量加总，等于把同一支片子数了 4 遍 —— 得到的「总播放」
#   没有任何含义，而且它看起来是个正常数字，不会报错、不会缺数据，
#   只会让人得出错的结论。因此快照里**不提供跨语区合计**，
#   所有指标一律按 locale 分开落到 youtube.locales.<locale> 下。
#   跨语区要比的是「同一支 PV 在不同语区的表现差异」，那是比值，不是和。
#
# ── channel_id 的填法 ───────────────────────────────────────────────
#
#   先只填 handle，运行
#       python collectors/youtube_discover.py --resolve
#   由 API 解析出真实 channel_id、频道名与订阅数并回填。
#   handle 是待验证的假设，channel_id 是接口给出的事实 ——
#   两者不一致时以接口为准，并在这里留记录。
#
# ⚠ handle 解析成功 ≠ 解析对了。--resolve 只能证明该 handle 存在，
#   不能证明它属于官方。实测踩到过三次：
#     @NevernesstoEverness → 51 订阅的俄语同人频道（曾被误配为 NTE 官方）
#     @ZZZ_TW              → 1 订阅的个人号「mati」
#     @NTE_KR              → 0 订阅的空号「네트워크」
#   三者都真实存在、都返回 200、--resolve 都会打印 [ok]。若照此采集，
#   看板照样有数字、页面照样正常，只是整块数据来自错误的频道。
#   因此每次改 handle 后必须核对 --resolve 打印的频道名与订阅数量级：
#   官方频道订阅数在十万级以上（NTE 韩/繁中较新，在三万级），
#   几十、几百订阅的一定是同人号或搬运号。
#
# 本表 12 个频道均已用 channels.list 逐个核验（标题 + 订阅数 + 国家）。
#
# ── 配额成本（免费层每天 10,000 units）──────────────────────────────
#   channels.list      1 unit   仅在解析 handle 时调用
#   playlistItems.list 1 unit   每频道每次发现
#   videos.list        1 unit   一次最多 50 个视频 ID
#   => 12 个频道每日发现 12 units + 视频统计按 50 个/unit，
#      即便登记 600 个视频也只有 12 + 12 = 24 units，占免费配额 0.24%。
#      绝不使用 search.list（100 units/次）—— 它只在一次性找频道时用过。

