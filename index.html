<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GamePulse · 游戏长线运营看板</title>
<meta name="description" content="用 Steam、B 站、YouTube 公开数据观察游戏版本更新前后的评测、在线与官方视频表现。">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="vendor/sql-wasm.wasm" as="fetch" type="application/wasm" crossorigin>
</head>
<body>
<a class="skip-link" href="#page">跳到内容</a>
<div class="app">
  <aside class="sidebar" aria-label="页面导航">
    <a class="brand" href="?page=overview">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none">
          <rect x="2" y="2" width="14" height="14" rx="4" fill="var(--ink)"/>
          <rect x="20" y="2" width="14" height="14" rx="4" fill="var(--module-yellow-key)"/>
          <rect x="2" y="20" width="14" height="14" rx="4" fill="var(--module-cyan-key)"/>
          <rect x="20" y="20" width="14" height="14" rx="4" fill="var(--module-pink-key)"/>
        </svg>
      </span>
      <span><strong>GamePulse</strong><small>长线运营</small></span>
    </a>
    <nav>
      <a data-page="overview" data-tone="yellow" href="?page=overview">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        运营总览
      </a>
      <a data-page="versions" data-tone="yellow" href="?page=versions">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg>
        版本对比
      </a>
      <a data-page="videos" data-tone="pink" href="?page=videos">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3Z"/></svg>
        视频传播
      </a>
      <a data-page="players" data-tone="cyan" href="?page=players">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/></svg>
        玩家结构
      </a>
      <a data-page="explore" data-tone="cyan" href="?page=explore">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M8 13v-3m5 3V8"/></svg>
        自助查询
      </a>
      <a data-page="sources" data-tone="yellow" href="?page=sources">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        数据来源
      </a>
    </nav>
    <p class="sidebar-note">公开数据 · Steam / B 站 / YouTube<br>Steam 在线不是 DAU</p>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="data-status" id="data-status" role="status">载入中</div>
      <div class="topbar-actions">
        <button type="button" class="ghost" id="share">复制链接</button>
        <button type="button" class="ghost" id="theme-toggle" aria-label="切换深浅色">深色</button>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main id="page" tabindex="-1">
      <div class="loading" id="loading">
        <p>载入中</p>
        <progress id="load-progress" aria-label="数据下载" max="1" value="0"></progress>
      </div>
    </main>
    <footer class="footer">
      GamePulse 是独立研究项目，使用各平台公开数据，不代表相关平台或游戏公司。
      <a href="https://github.com/acetaffyace/Gamepulse">源码与口径说明</a>
    </footer>
  </div>
</div>
<div class="tooltip-toast" id="toast" role="status" hidden></div>
<div class="sr-only" id="view-status" role="status" aria-live="polite"></div>
<script type="module" src="lib/app.js"></script>
</body>
</html>
